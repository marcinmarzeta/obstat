name: publish

# Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is no
# API token anywhere — not in the repo, not in secrets, not on a laptop. Register
# the publisher once at https://pypi.org/manage/account/publishing/ with:
#
#   owner marcinmarzeta · repository obstat · workflow publish.yml · environment pypi
#
# Then a tag publishes:  git tag v0.1.0 && git push --tags

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # actions/* float on their major tag; setup-uv stopped publishing one
      # after v7, so it is pinned exactly.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      # The tag is the release, so the tests that gate main gate this too. A
      # broken build reaching PyPI cannot be taken back — versions are immutable.
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI checks
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # After the upload, so a failed publish leaves no release pointing at a
      # version PyPI never got. v0.2.0–v0.5.0 were tags with no release because
      # nothing did this; the generated notes are a floor — edit the release
      # afterwards for the hand-written kind v0.1.1 set the style for.
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
